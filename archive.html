<!DOCTYPE html>
<html>
<head>
<title>Max Tindall - archive</title>
<meta charset="UTF-8">
<style>
* { font-family: "Courier New", monospace; }
html, body, a { cursor: crosshair; }
a { color: black; text-decoration: underline; }
a:hover { color: hotpink; text-decoration: none; }
body { margin: 0; padding-left: 18px; padding-top: 14px; }
#container { width: 750px; max-width: calc(100vw - 36px); }
#list { width: 575px; max-width: 100%; }
h1 { font-size: 50px; margin: 0; padding-bottom: 14px; text-decoration: underline; }
.entry { margin: 0 0 22px; }
.when { font-size: 14px; opacity: 0.8; margin-bottom: 2px; }
.text { font-size: 16px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
#pager { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin: 6px 0 40px; font-size: 14px; }
#pager .cur { font-weight: bold; }
#pager .off { opacity: 0.35; }
@media (pointer: coarse) { #pager a, #pager span { padding: 10px 0; } }   /* roomier tap targets */
</style>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="mobile.css?v=2">
</head>
<body>
<div id="container">
<h1><a href="index.html">MAX TINDALL</a></h1>
<p style="font-size:16px;margin:0 0 22px">&larr; <a href="index.html">back</a></p>
<div id="list"></div>
<div id="pager"></div>
</div>
<script>
/* proper capitalisation for updates only: first letter, after . ! ?, and standalone "i" */
function capitalise(t) {
  return t.replace(/(^|[.!?]\s+)([a-z])/g, (m, a, b) => a + b.toUpperCase())
          .replace(/\bi\b(?=['\s.,!?;:]|$)/g, "I");
}
/* PAGES FIT THE SCREEN. A page keeps adding updates (newest first) until the next one
   would push the pager off the bottom of the window. The URL names the first update shown
   (?n=8 = start at the 8th newest), not a page number, so a link or a rotated phone lands
   on the same update whatever the screen size. */
const MIN_SHOWN = 3, MAX_SHOWN = 12;   /* never fewer than 3 (tiny screens scroll), never more than 12 */
const PAGER_ROOM = matchMedia("(pointer: coarse)").matches ? 92 : 64;   /* px kept free under the list for the pager (taller tap targets on touch) */

let all = [];
let start = 0;                         /* index of the first update on this page (0 = newest) */

function makeEntry(u) {
  const e = document.createElement("div"); e.className = "entry";
  const w = document.createElement("div"); w.className = "when";
  w.textContent = new Date(u.date).toLocaleString("en-GB",
    { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  const t = document.createElement("div"); t.className = "text"; t.textContent = capitalise(u.text);
  e.append(w, t);
  return e;
}

function render() {
  const list = document.getElementById("list");
  list.textContent = "";
  let shown = 0;
  while (start + shown < all.length && shown < MAX_SHOWN) {
    const el = makeEntry(all[start + shown]);
    list.appendChild(el);
    shown++;
    const bottom = list.getBoundingClientRect().bottom + window.scrollY + PAGER_ROOM;
    if (bottom > window.innerHeight && shown > MIN_SHOWN) {   /* this one doesn't fit: take it back */
      list.removeChild(el);
      shown--;
      break;
    }
  }
  renderPager(shown);
}

/* pager: "<- newer   8-14 of 27   older ->" */
function renderPager(shown) {
  const pager = document.getElementById("pager");
  pager.textContent = "";
  const end = start + shown;
  if (start === 0 && end >= all.length) return;          /* everything fits: no pager */

  const href = from => from <= 0 ? "archive.html" : "archive.html?n=" + (from + 1);
  const link = (from, text) => {
    const el = document.createElement(from === null ? "span" : "a");
    el.textContent = text;
    if (from === null) el.className = "off"; else el.href = href(from);
    return el;
  };
  const range = document.createElement("span");
  range.className = "cur";
  range.textContent = (start + 1) + "\u2013" + end + " of " + all.length;

  pager.append(link(start > 0 ? Math.max(0, start - shown) : null, "\u2190 newer"),
               range,
               link(end < all.length ? end : null, "older \u2192"));
}

fetch("updates.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(d => {
    const list = document.getElementById("list");
    if (!d.updates.length) { list.textContent = "nothing yet."; return; }
    all = d.updates.slice().reverse();
    const asked = parseInt(new URLSearchParams(location.search).get("n"), 10);
    /* bad or missing ?n= -> newest; one past the end -> the last few, not a lonely single update */
    start = Math.min(Math.max(0, all.length - MIN_SHOWN), Math.max(0, (asked || 1) - 1));
    render();
  })
  .catch(() => { document.getElementById("list").textContent = "could not load."; });

/* re-fit when the window width changes (rotation, resize). Height-only changes are ignored:
   on phones the address bar showing and hiding resizes the window while you scroll. */
let lastW = window.innerWidth;
window.addEventListener("resize", () => {
  if (window.innerWidth !== lastW) { lastW = window.innerWidth; if (all.length) render(); }
});
</script>
</body>
</html>
