<!DOCTYPE html>
<html>
<head>
  <title>Max Tindall</title>
  <meta charset="UTF-8">

<style>

/* GLOBAL */
* { font-family: "Courier New", monospace; }
html, body, a { cursor: crosshair; }

a { color: black; text-decoration: underline; }
a:hover { color: hotpink; text-decoration: none; }

body {
  margin: 0;
  padding-left: 18px;
  padding-top: 14px;
}

/* LAYOUT */
#container { width: 750px; }

h1 {
  font-size: 50px;
  margin: 0;
  padding-bottom: 14px;
  text-decoration: underline;
}

/* IMAGE AREA */
#portrait {
  float: left;
  width: 575px;
  height: 575px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* IMAGE */
#mainImage {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  cursor: grab;
  user-select: none;
}

/* ZOOMED: the image is panned inside its frame and clipped to it */
#portrait.zoomed { position: relative; overflow: hidden; }
#portrait.zoomed #mainImage {
  position: absolute;
  max-width: none;
  max-height: none;
  touch-action: none;
  -webkit-user-drag: none;
}
#mainImage.dragging { cursor: grabbing; }

/* MENU */
#menu {
  font-size: 20px;
  float: right;
  width: 175px;
}

#dateOnly { margin-top: 18px; font-size: 16px; }
#timeOnly { font-size: 14px; opacity: 0.8; }

/* NEW DESCRIPTION */
#description {
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.25;
  opacity: 0.8;
}

/* STATE MARKER + KEY HINTS */
#status {
  margin-top: 10px;
  font-size: 14px;
  font-weight: bold;
}

#keys {
  margin-top: 20px;
  padding: 8px;
  border: 1px dashed currentColor;
  font-size: 12px;
  line-height: 1.6;
  opacity: 0.8;
  display: grid;
  grid-template-columns: 76px 1fr;
}

@media (hover: none) { #keys { display: none; } }  /* touch screens: no keyboard */

.clear { clear: both; }

</style>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="mobile.css">
</head>

<body>

<div id="container">

  <h1><a href="index.html">MAX TINDALL</a></h1>

  <div id="portrait">
    <img id="mainImage">
  </div>

  <div id="menu">
    <a href="about.html">about</a><br/>
    <a href="links.html">links</a><br/>
    <a href="projects.html">projects</a><br/>
    <a href="selected_work.html">selected work</a><br/>

    <div id="dateOnly"><span id="dateText"></span></div>
    <div id="timeOnly"><span id="timeText"></span></div>

    <!-- NEW DESCRIPTION -->
    <div id="description"></div>
    <div id="status"></div>

    <div id="keys">
      <span>[space]</span><span>pause</span>
      <span>[&larr;] [&rarr;]</span><span>prev / next</span>
      <span>dbl-click</span><span>zoom</span>
      <span>drag</span><span>pan</span>
      <span>[+] [-]</span><span>zoom level</span>
    </div>

    <div id="controls">
      <div class="row">
        <button id="prevBtn" type="button" aria-label="previous work">&larr;</button>
        <button id="pauseBtn" type="button">pause</button>
        <button id="nextBtn" type="button" aria-label="next work">&rarr;</button>
      </div>
      <div class="hint">swipe to browse<br>double-tap to zoom<br>pinch + drag to explore</div>
    </div>
  </div>

  <div class="clear"></div>

</div>

<script>

/* DATE + TIME */
function updateDate() {
  document.getElementById("dateText").textContent =
    new Date().toLocaleDateString('en-GB', {
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    });
}

function updateTime() {
  document.getElementById("timeText").textContent =
    new Date().toLocaleTimeString('en-GB', { hour12: false });
}

updateDate();
updateTime();
setInterval(updateTime, 1000);

/* GALLERY WITH DESCRIPTIONS */

/* works come from works.json (managed by the Telegram bot);
   the number is automatic: position in the list, zero-padded */
let gallery = [];
const label = i => String(i + 1).padStart(3, "0") + ". " + gallery[i].caption;

let index = 0;
const img = document.getElementById("mainImage");
const description = document.getElementById("description");
const statusEl = document.getElementById("status");
const pauseBtn = document.getElementById("pauseBtn");

/* state marker under the caption */
function renderStatus() {
  statusEl.textContent = zoomed ? "zoomed" : paused ? "paused" : "unpaused";
  pauseBtn.textContent = paused ? "resume" : "pause";
}

/* INITIAL LOAD */
function init() {
  if (!gallery.length) return;
  img.src = gallery[0].src;
  description.textContent = label(0);
  renderStatus();

  /* PRELOAD */
  gallery.forEach(item => {
    const i = new Image();
    i.src = item.src;
  });

  startRotation();
}

/* ROTATION */

let interval = null;
let paused = false;   /* space bar toggles; stays paused until pressed again */
let zoomed = false;

/* show work i (wraps around); a zoom carries over to the new work */
function show(i) {
  index = (i + gallery.length) % gallery.length;
  description.textContent = label(index);
  if (zoomed) {
    img.style.visibility = "hidden";    /* until the full-res copy has loaded */
    img.onload = () => {
      img.onload = null;
      img.style.visibility = "";
      fit = fitSize(img.naturalWidth, img.naturalHeight);
      setZoom(zoomK, 0.5, 0.5, stage.clientWidth / 2, stage.clientHeight / 2);
    };
    img.src = gallery[index].full;
  } else {
    img.src = gallery[index].src;
  }
}

function startRotation() {
  if (!interval && !paused && !zoomed) {
    interval = setInterval(() => show(index + 1), 4000);
  }
}

function stopRotation() {
  clearInterval(interval);
  interval = null;
}

fetch("works.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(d => { gallery = d.works; init(); })
  .catch(() => {});

/* KEYBOARD: space = pause / resume, left / right = previous / next */

function togglePause() {
  paused = !paused;
  if (paused) stopRotation(); else startRotation();
  renderStatus();
}

/* previous / next; restart the clock so the new image gets its full time */
function step(dir) {
  show(index + dir);
  if (interval) {
    stopRotation();
    startRotation();
  }
}

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || !gallery.length) return;

  if (e.key === " ") {
    e.preventDefault();                 /* no page scroll */
    togglePause();
  } else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    step(e.key === "ArrowRight" ? 1 : -1);
  } else if (zoomed && (e.key === "Escape")) {
    exitZoom();
  } else if (zoomed && ["+", "=", "-", "_"].includes(e.key)) {
    e.preventDefault();                 /* zoom level, about the centre of the frame */
    const grow = e.key === "+" || e.key === "=";
    const sw = stage.clientWidth, sh = stage.clientHeight;
    setZoom(zoomK * (grow ? 1.4 : 1 / 1.4),
            (sw / 2 - view.x) / view.w, (sh / 2 - view.y) / view.h, sw / 2, sh / 2);
  }
});

/* touch buttons */
document.getElementById("prevBtn").addEventListener("click", () => step(-1));
document.getElementById("nextBtn").addEventListener("click", () => step(1));
pauseBtn.addEventListener("click", togglePause);

/* ZOOM: double-click zooms in on the spot you click, drag pans, + / - change the
   level, double-click (or Esc) zooms out. The image is panned inside its frame
   and can't be dragged out of it. */

const stage = document.getElementById("portrait");
const ZOOM_DEFAULT = 6, ZOOM_MIN = 2, ZOOM_MAX = 16;
let zoomK = ZOOM_DEFAULT;   /* zoom factor relative to the fitted size */
let fit = null;             /* fitted (unzoomed) size of the current image */
let view = null;            /* size and offset of the image inside the frame while zoomed */

function fitSize(nw, nh) {
  const f = Math.min(1, stage.clientWidth / nw, stage.clientHeight / nh);
  return { w: nw * f, h: nh * f };
}

function applyView() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  /* keep the image covering the frame (centred if it is smaller than it) */
  view.x = view.w <= sw ? (sw - view.w) / 2 : Math.min(0, Math.max(sw - view.w, view.x));
  view.y = view.h <= sh ? (sh - view.h) / 2 : Math.min(0, Math.max(sh - view.h, view.y));
  img.style.width = view.w + "px";
  img.style.height = view.h + "px";
  img.style.left = view.x + "px";
  img.style.top = view.y + "px";
}

/* zoom to factor k, keeping fraction (fx, fy) of the image under frame point (px, py) */
function setZoom(k, fx, fy, px, py) {
  zoomK = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, k));
  const w = fit.w * zoomK, h = fit.h * zoomK;
  view = { w, h, x: px - fx * w, y: py - fy * h };
  applyView();
}

function enterZoom(cx, cy) {
  const r = img.getBoundingClientRect(), s = stage.getBoundingClientRect();
  fit = fitSize(img.naturalWidth, img.naturalHeight);
  zoomed = true;
  stopRotation();
  stage.classList.add("zoomed");
  img.src = gallery[index].full;        /* full resolution */
  setZoom(ZOOM_DEFAULT, (cx - r.left) / r.width, (cy - r.top) / r.height,
          cx - s.left, cy - s.top);
  renderStatus();
}

function exitZoom() {
  zoomed = false;
  view = null;
  img.onload = null;
  stage.classList.remove("zoomed");
  img.style.cssText = "";
  img.src = gallery[index].src;         /* back to the light display copy */
  startRotation();                      /* no-op while paused */
  renderStatus();
}

function toggleZoom(cx, cy) {
  if (zoomed) exitZoom(); else enterZoom(cx, cy);
}

/* POINTERS. Mouse: double-click zooms, drag pans.
   Touch: swipe browses, double-tap zooms, one finger pans, two fingers pinch.
   Pointer events keep tracking even if the pointer leaves the image. */

const pointers = new Map();   /* active pointers: id -> {x, y} */
let lastType = "mouse";
let drag = null;              /* one-pointer pan while zoomed */
let pinch = null;             /* two-finger zoom: start distance, level, image point */
let tap = null;               /* where / when the current touch began */
let lastTap = null;           /* previous tap, for double-tap */

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

img.addEventListener("dblclick", (e) => {
  if (lastType === "mouse") toggleZoom(e.clientX, e.clientY);
});

img.addEventListener("pointerdown", (e) => {
  lastType = e.pointerType;
  if (e.pointerType === "mouse" && (e.button !== 0 || !zoomed)) return;
  e.preventDefault();
  img.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 2 && zoomed) {
    const [a, b] = [...pointers.values()];
    const s = stage.getBoundingClientRect();
    const mx = (a.x + b.x) / 2 - s.left, my = (a.y + b.y) / 2 - s.top;
    pinch = { d: dist(a, b), k: zoomK, fx: (mx - view.x) / view.w, fy: (my - view.y) / view.h };
    drag = null;
    tap = null;
  } else if (pointers.size === 1) {
    tap = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
    if (zoomed) {
      drag = { x: e.clientX - view.x, y: e.clientY - view.y };
      img.classList.add("dragging");
    }
  }
});

img.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 10) tap.moved = true;

  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const s = stage.getBoundingClientRect();
    setZoom(pinch.k * dist(a, b) / pinch.d, pinch.fx, pinch.fy,
            (a.x + b.x) / 2 - s.left, (a.y + b.y) / 2 - s.top);
  } else if (drag) {
    view.x = e.clientX - drag.x;
    view.y = e.clientY - drag.y;
    applyView();
  }
});

function releasePointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);

  /* lifting one finger of a pinch: carry on panning with the other */
  if (pinch && pointers.size < 2) {
    pinch = null;
    const p = [...pointers.values()][0];
    if (p && zoomed) drag = { x: p.x - view.x, y: p.y - view.y };
  }
  if (pointers.size) return;

  drag = null;
  img.classList.remove("dragging");
  const t = tap;
  tap = null;
  if (!t || e.type !== "pointerup" || e.pointerType === "mouse") return;

  const dx = e.clientX - t.x, dy = e.clientY - t.y;
  if (!zoomed && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    lastTap = null;
    step(dx < 0 ? 1 : -1);              /* swipe left = next */
  } else if (!t.moved && performance.now() - t.t < 300) {
    const now = performance.now();
    if (lastTap && now - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
      lastTap = null;
      toggleZoom(e.clientX, e.clientY);  /* double-tap */
    } else {
      lastTap = { t: now, x: e.clientX, y: e.clientY };
    }
  }
}
img.addEventListener("pointerup", releasePointer);
img.addEventListener("pointercancel", releasePointer);
img.addEventListener("dragstart", (e) => e.preventDefault());

/* rotating the phone / resizing the window changes the frame: leave zoom */
let frameW = stage.clientWidth;
window.addEventListener("resize", () => {
  if (stage.clientWidth !== frameW) {
    frameW = stage.clientWidth;
    if (zoomed) exitZoom();
  }
});

</script>

</body>
</html>
