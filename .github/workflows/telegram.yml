name: telegram-updates
on:
  schedule:
    # slow backup only: GitHub throttles schedules on quiet repos. The real
    # trigger is the Cloudflare cron in ops/cloudflare-trigger (every 2 min).
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: telegram-updates
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - id: fetch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          out=$(python3 scripts/fetch_updates.py)
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Commit and redeploy
        if: steps.fetch.outputs.out == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "telegram-bot"
          git config user.email "telegram-bot@users.noreply.github.com"
          git add -A
          git commit -m "update from telegram"
          git push
          # pushes made with GITHUB_TOKEN don't trigger the deploy workflow
          gh workflow run site.yml
      # every poll: if the live site is behind the repo and no deploy is making progress
      # (Pages deploys occasionally hang), cancel the stuck one and start a fresh deploy
      - name: Heal a stuck or stale deploy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/heal_deploy.sh
